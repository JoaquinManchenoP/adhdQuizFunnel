<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHD self-check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    /* Marigold scale — exact hex from design handoff */
    --marigold-50: #FFFAEA;
    --marigold-100: #FFF1C6;
    --marigold-300: #FEDD77;
    --marigold-500: #F5C22E;
    --marigold-700: #A67A0C;
    --marigold-800: #6E5008;
    /* Teal/mint accent scale — added for T011's marigold + teal restyle.
       Fresh & calm family, user-specified hexes, used only on breather
       and calculating screens alongside the marigold scale above. */
    --teal-300: #7ED9C9;
    --teal-500: #6FCF97;
    --teal-700: #2D9C8F;
    /* Ink (neutral) scale — exact hex from design handoff */
    --ink-0: #FFFFFF;
    --ink-50: #FBF8F3;
    --ink-100: #F4EFE8;
    --ink-200: #E7DFD5;
    --ink-300: #D2C7BA;
    --ink-900: #2A211A;
    /* Semantic aliases used in the mockup source but not exported with
       explicit hex values — reasonably inferred from the ink/marigold
       scale and standard contrast practice. Flagged for the person to
       verify against the actual design system if/when they have access
       to it. */
    --text-strong: var(--ink-900);
    --text-muted: #7A6C5D;
    --text-subtle: #9C8F80;
    --border-subtle: var(--ink-200);
    --border-default: var(--ink-300);
    --surface-page: var(--ink-0);
    /* Radius */
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-pill: 999px;
    /* Severity colors — not part of the Marigold brand scale, used only
       for the Low/Moderate/High result label, kept separate deliberately */
    --mint: #8FE0A8;
    --mint-ink: #1B4D33;
    --coral: #F0AB8E;
    --coral-ink: #6B3117;
    --blue: #A9C7EA;
    --blue-ink: #1E3A5C;
  }

  * { box-sizing: border-box; }

  /* Body background is the warm off-white --ink-50, not pure white — this
     is the actual page surface per the mockup source, distinct from
     --surface-page (pure white) used for inset elements like the gauge's
     inner circle. */
  body {
    margin: 0;
    background: var(--ink-50);
    color: var(--text-strong);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    padding: 24px 20px 80px;
  }

  /* NOTE: the mockup's ".phone" frame (border, shadow, 28px radius) is
     explicitly documented as "a mockup framing device, not part of the
     real UI" — so it is deliberately NOT recreated here. Content sits
     directly on the page background, matching the actual intended
     production UI rather than the presentation artifact. */
  .stage { width: 100%; max-width: 390px; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .topbar .back {
    background: none; border: none; cursor: pointer;
    color: var(--text-strong); padding: 0;
    display: flex; align-items: center;
    width: 22px; height: 22px;
  }
  .topbar .label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600; font-size: 15px; color: var(--text-strong);
  }
  .topbar .spacer { width: 22px; }

  .progress-block { margin-bottom: 28px; }
  .progress-label-row {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    min-height: 16px;
  }
  .progress-track {
    height: 8px;
    border-radius: var(--radius-pill);
    background: var(--ink-100);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: var(--radius-pill);
    background: var(--marigold-300);
    transition: width 0.35s cubic-bezier(.4,0,.2,1);
  }

  .icon-square {
    width: 56px; height: 56px;
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    background: linear-gradient(160deg, var(--marigold-100), var(--marigold-300));
  }
  .icon-square.mint { background: linear-gradient(160deg, #E4F8EA, var(--mint)); }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--marigold-800);
    background: var(--marigold-100);
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 24px;
    line-height: 1.3;
    letter-spacing: -0.01em;
    color: var(--text-strong);
    margin: 0 0 10px 0;
  }

  p.lede {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-muted);
    margin: 0 0 28px 0;
    font-weight: 400;
  }
  p.lede.centered { text-align: center; }
  p.lede.small { font-size: 13.5px; margin-bottom: 22px; }

  .question-text {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 22px;
    line-height: 1.35;
    letter-spacing: -0.005em;
    color: var(--text-strong);
    margin: 0 0 24px 0;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .question-hint {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--marigold-700);
    margin: -14px 0 14px 0;
  }

  /* Answer row — exact structure: flex row, space-between, so a check
     icon (added only when selected) naturally right-aligns without
     needing absolute positioning. Text color does NOT change on
     selection per the mockup — only background and border do. */
  .option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border: 1.5px solid var(--border-subtle);
    border-radius: var(--radius-md);
    background: var(--ink-50);
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    color: var(--text-strong);
    text-align: left;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .option:hover { transform: translateY(-1px); }
  .option:active { transform: translateY(0) scale(0.99); }
  .option:focus-visible { outline: 2px solid var(--marigold-500); outline-offset: 2px; }
  .option.selected {
    background: var(--marigold-50);
    border-color: var(--marigold-500);
    animation: optionPop 0.28s ease;
  }
  .option .check-icon {
    opacity: 0;
    color: var(--marigold-700);
    display: flex;
    flex-shrink: 0;
  }
  .option.selected .check-icon { opacity: 1; }

  @keyframes optionPop {
    0% { transform: scale(1); }
    45% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  /* Button — 48px height per spec. Text uses dark ink rather than white:
     the marigold family is light/bright enough that white text fails
     contrast, confirmed earlier in this project with the same color
     family, so applied here too even though the source component's
     internal text-color logic isn't available in this export. */
  .btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    border: none;
    border-radius: var(--radius-pill);
    height: 48px;
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--marigold-300); color: var(--ink-900); }
  .btn.primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .microcopy {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    color: var(--text-subtle);
    text-align: center;
    margin-top: 10px;
  }

  .band-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    margin-bottom: 4px;
    background: var(--mint);
    color: var(--mint-ink);
  }
  .band-badge.low { background: var(--blue); color: var(--blue-ink); }
  .band-badge.high { background: var(--coral); color: var(--coral-ink); }

  .disclaimer {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-subtle);
    border-top: 1px solid var(--border-subtle);
    margin-top: 24px;
    padding-top: 16px;
  }

  .trust-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 16px;
  }
  .trust-row svg { flex-shrink: 0; margin-top: 1px; }
  .trust-row span {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    line-height: 1.55;
    color: var(--text-subtle);
  }

  .field-label {
    display: block;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-strong);
    margin-bottom: 6px;
  }

  input[type="email"] {
    width: 100%;
    height: 44px;
    padding: 0 16px;
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-md);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    background: var(--surface-page);
    color: var(--text-strong);
  }
  input[type="email"]:focus-visible { outline: none; border-color: var(--ink-900); border-width: 2px; }

  .calc-companion-icon { display: inline-block; margin-bottom: 20px; }

  .metric-row { margin-bottom: 16px; }
  .metric-row:last-child { margin-bottom: 0; }
  .metric-label-row {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .metric-track {
    height: 8px;
    border-radius: var(--radius-pill);
    background: var(--ink-100);
    overflow: hidden;
  }
  .metric-fill {
    height: 100%;
    width: 0%;
    border-radius: var(--radius-pill);
  }

  .breather {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 8px 0 12px;
  }
  .breather-icon {
    width: 240px; height: 220px;
    border-radius: 46% 54% 43% 57% / 57% 42% 58% 43%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  .breather-text {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 21px;
    line-height: 1.45;
    letter-spacing: -0.01em;
    color: var(--text-strong);
    max-width: 320px;
    margin: 0;
  }
  .breather-timer-track {
    width: 130px;
    height: 5px;
    border-radius: var(--radius-pill);
    background: var(--ink-100);
    overflow: hidden;
    margin-top: 24px;
  }
  .breather-timer-fill {
    height: 100%;
    width: 0%;
    border-radius: var(--radius-pill);
  }
  @media (prefers-reduced-motion: reduce) { .breather-timer-fill { transition: none !important; } }

  .fade-in { animation: fadeIn 0.3s cubic-bezier(.4,0,.2,1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* Gauge — conic-gradient exactly as specced, animated via a CSS custom
     property. Inner circle uses --surface-page (pure white) which sits
     on top of the page's warm off-white background, matching the
     mockup's layering. */
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
  .gauge-outer {
    --gauge-pct: 0%;
    width: 168px; height: 168px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: conic-gradient(var(--marigold-300) var(--gauge-pct), var(--ink-100) var(--gauge-pct));
  }
  .gauge-outer.animating { transition: --gauge-pct 1.1s cubic-bezier(.34,1.1,.64,1); }
  .gauge-inner {
    width: 132px; height: 132px;
    border-radius: 50%;
    background: var(--surface-page);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .gauge-percent {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 34px;
    color: var(--text-strong);
    letter-spacing: -0.01em;
  }
  .gauge-caption { font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 11px; color: var(--text-muted); }

  .result-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 19px;
    text-align: center;
    color: var(--text-strong);
    letter-spacing: -0.005em;
    margin: 0 0 8px 0;
  }

  .locked-teaser {
    border: 1.5px dashed var(--border-default);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 20px;
  }
  .locked-teaser-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-strong);
    margin-bottom: 10px;
  }
  .locked-teaser-header svg { color: var(--text-muted); flex-shrink: 0; }
  /* Skeleton bars: 4px radius exactly, NOT a pill — this was a real
     discrepancy from an earlier pass, corrected here. */
  .skeleton-bar { height: 10px; background: var(--ink-100); border-radius: 4px; }
  .skeleton-bars { display: flex; flex-direction: column; gap: 8px; }

  @property --gauge-pct {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 0%;
  }

  ::view-transition-old(quiz-card) { animation: card-out 0.24s cubic-bezier(.4,0,.2,1) forwards; }
  ::view-transition-new(quiz-card) { animation: card-in 0.3s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes card-out { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-6px); } }
  @keyframes card-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
    .progress-fill { transition: none; }
    .gauge-outer.animating { transition: none; }
    ::view-transition-old(quiz-card), ::view-transition-new(quiz-card) { animation: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div id="card" style="view-transition-name: quiz-card;"></div>
</div>

<script>
/* ---------------- QUESTION DATA (18-item set) ---------------- */
const QUESTIONS = [
  { text: "How often do you start something, then never actually finish it?", domain: "A" },
  { text: "How often do you just forget things you meant to do?", domain: "A" },
  { text: "How often do you put off starting things that require focus or mental effort?", domain: "A" },
  { text: "How often do you feel restless?", domain: "B" },
  { text: "Do you have trouble staying still?", domain: "B" },
  { text: "How often do you interrupt people without meaning to?", domain: "B" },
  { text: "How often does just getting yourself ready for a task feel harder than the task itself?", domain: "A" },
  { text: "How hard is it for you to relax?", domain: "B", hint: "This one's about difficulty, not frequency:", options: ["Not hard at all", "A little hard", "Moderately hard", "Very hard", "Extremely hard"] },
  { text: "How often do you make mistakes because you got distracted?", domain: "A" },
  { text: "How often do you zone out while someone's talking to you?", domain: "A" },
  { text: "How often do you lose things you regularly need?", domain: "A" },
  { text: "How often are you distracted by sounds?", domain: "A" },
  { text: "Does this sound like you? \u201CI often feel misunderstood by the people around me.\u201D", domain: "C", options: ["No", "Yes"] },
  { text: "How often do you get so absorbed in something that you lose track of everything else?", domain: "C" },
  { text: "How often do you start the day meaning to get organized, then end up feeling like you failed?", domain: "C" },
  { text: "Do you ever feel like a fraud, even when things are actually going fine?", domain: "C", options: ["No", "Yes"] },
  { text: "Do you go out of your way to keep people happy with you?", domain: "C", options: ["No", "Yes"] },
  { text: "Are you harder on yourself than you'd ever be on anyone else?", domain: "C", options: ["No", "Yes"] },
];

const OPTIONS = ["Never", "Rarely", "Sometimes", "Often", "Very Often"];
const PART_A_COUNT = 6;

let answers = new Array(QUESTIONS.length).fill(null);
let screen = "genderSelect";
let qIndex = 0;
let breatherIndex = 0;
let selectedGender = null;
let selectedAge = null;
let selectedDiagnosis = null;
const AGE_RANGES = ["18 to 24", "25 to 34", "35 to 44", "45 to 54", "55 to 64", "65+"];
const GENDER_OPTIONS = ["Woman", "Man", "Nonbinary", "Prefer not to say"];
const DIAGNOSIS_OPTIONS = ["I'm diagnosed by a doctor", "I'm self diagnosed", "I suspect I might have ADHD", "Something else"];

// Palette: two-tone marigold + teal system (T011). Marigold carries the
// first and last message (dominant/bookend tone); teal is the accent in
// the middle message, keeping the run from reading as three unrelated
// hues. `solid` is reused for both the icon-blob's outer gradient stop
// and the thin timer-fill bar, so each `solid` value was picked to clear
// ~3:1 contrast against the timer track's `--ink-100` background —
// avoiding the T007-flagged mistake of a light fill (e.g. marigold-300)
// nearly disappearing against a light track.
const BREATHERS = [
  { message: "It's okay if some of these feel familiar. That's kind of the point.", pale: "var(--marigold-100)", solid: "var(--marigold-700)", pose: poseIdleSvg },
  { message: "No right or wrong answers. Just be honest with yourself.", pale: "var(--teal-300)", solid: "var(--teal-700)", pose: poseThinkingSvg },
  { message: "Noticing these patterns is already a step forward.", pale: "var(--marigold-300)", solid: "var(--marigold-800)", pose: poseIdleSvg },
];

function partAScore() { return answers.slice(0, PART_A_COUNT).reduce((s, v) => s + (v ?? 0), 0); }
function partABand(percent) {
  if (percent < 15) return { label: "Low signs of ADHD-related traits", cls: "low", copy: "Few ADHD-related patterns showed up in your answers." };
  if (percent < 35) return { label: "Mild signs of ADHD-related traits", cls: "low", copy: "A few ADHD-related patterns showed up, but not often." };
  if (percent < 55) return { label: "Moderate signs of ADHD-related traits", cls: "", copy: "Some of your answers match patterns common in ADHD. Others not so much." };
  if (percent < 75) return { label: "Strong signs of ADHD-related traits", cls: "high", copy: "Several ADHD-related patterns showed up often. It may be worth taking a closer look." };
  return { label: "Very strong signs of ADHD-related traits", cls: "high", copy: "Most core ADHD-related patterns showed up often. Talking to a professional could help." };
}
function fullScoring() {
  const inattentiveIdx = [0,1,2,6,8,9,10,11];
  const hyperImpulsiveIdx = [3,4,5,7];
  const sum = (idxs) => idxs.reduce((s,i) => s + (answers[i] ?? 0), 0);
  const inattentive = sum(inattentiveIdx);
  const hyperImpulsive = sum(hyperImpulsiveIdx);
  const inattentivePct = inattentive / (inattentiveIdx.length * 4);
  const hyperImpulsivePct = hyperImpulsive / (hyperImpulsiveIdx.length * 4);
  const diff = (inattentivePct - hyperImpulsivePct) * 100;
  let subtype = "Combined";
  if (diff > 15) subtype = "Inattentive-leaning";
  else if (diff < -15) subtype = "Hyperactive-Impulsive-leaning";
  const totalMax = QUESTIONS.reduce((s, q) => s + ((q.options ? q.options.length : OPTIONS.length) - 1), 0);
  return { inattentive, hyperImpulsive, inattentivePct, hyperImpulsivePct, subtype, totalScore: answers.reduce((s,v) => s + (v ?? 0), 0), totalMax };
}

// Colors alternate marigold/teal row-to-row so adjacent bars are always
// distinguishable at a glance. Only the darker shades of each family are

// marigold-300 were computed to have ~1.16:1 contrast against the
// `--ink-100` metric-track background (the exact T007-flagged bug where

let calcMetricTargets = [];

  // These bars are purely illustrative — not derived from the person's

function prefersReducedMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function animateResultGauge(percent) {
  const gauge = document.getElementById('gaugeOuter');
  const numEl = document.getElementById('percentNum');
  if (!gauge || !numEl) return;
  if (prefersReducedMotion()) {
    gauge.style.setProperty('--gauge-pct', percent + '%');
    numEl.textContent = percent + '%';
    return;
  }
  gauge.classList.add('animating');
  requestAnimationFrame(() => { gauge.style.setProperty('--gauge-pct', percent + '%'); });
  const duration = 1100;
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    numEl.textContent = Math.round(eased * percent) + '%';
    if (t < 1) requestAnimationFrame(tick);
    else numEl.textContent = percent + '%';
  }
  requestAnimationFrame(tick);
}

function animateCalculatingScreen() {
  const phrases = ["Analyzing your answers\u2026", "Cross referencing patterns\u2026", "Comparing to common traits\u2026", "Finalizing your results\u2026"];
  let phraseIdx = 0;
  const captionInterval = setInterval(() => {
    if (screen !== 'calculating') { clearInterval(captionInterval); return; }
    phraseIdx = (phraseIdx + 1) % phrases.length;
    const el = document.getElementById('calcCaption');
    if (el) el.textContent = phrases[phraseIdx];
  }, 2000);

  const stagger = 350;   // ms between each bar starting
  const duration = 5500; // ms each bar takes to fill, smoothly, via CSS

  if (prefersReducedMotion()) {
    CALC_METRICS.forEach((m, i) => {
      const fillEl = document.getElementById('metricFill' + i);
      const pctEl = document.getElementById('metricPct' + i);
      if (fillEl) fillEl.style.width = calcMetricTargets[i] + '%';
      if (pctEl) pctEl.textContent = calcMetricTargets[i] + '%';
    });
    return;
  }

  CALC_METRICS.forEach((m, i) => {
    const fillEl = document.getElementById('metricFill' + i);
    if (!fillEl) return;
    setTimeout(() => {
      if (screen !== 'calculating') return;
      // A gentle ease-in-out cubic-bezier, native CSS transition — smoother
      // and more reliably jank-free than setting width by hand every frame.
      fillEl.style.transition = `width ${duration}ms cubic-bezier(.45,0,.2,1)`;
      requestAnimationFrame(() => { fillEl.style.width = calcMetricTargets[i] + '%'; });
    }, i * stagger);
  });

  // The number count-up runs on its own rAF loop, timed to match each bar's
  // stagger/duration, independent of the CSS-driven width animation above.
  const start = performance.now();
  function tick(now) {
    if (screen !== 'calculating') return;
    let stillAnimating = false;
    CALC_METRICS.forEach((m, i) => {
      const barStart = start + i * stagger;
      const elapsed = now - barStart;
      if (elapsed < 0) { stillAnimating = true; return; }
      const t = Math.min(1, elapsed / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const val = Math.round(eased * calcMetricTargets[i]);
      const pctEl = document.getElementById('metricPct' + i);
      if (pctEl) pctEl.textContent = val + '%';
      if (t < 1) stillAnimating = true;
    });
    if (stillAnimating) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function animateBreatherTimer() {
  const fill = document.getElementById('breatherTimerFill');
  if (!fill) return;
  if (prefersReducedMotion()) { fill.style.width = '100%'; return; }
  requestAnimationFrame(() => { fill.style.transition = 'width 4s linear'; fill.style.width = '100%'; });
}

}

function render() {
  const showTitle = (screen === 'genderSelect' || screen === 'question' || screen === 'ageSelect' || screen === 'diagnosisStatus' || screen === 'breather');
  const html = topbarHtml(showTitle) + progressBlockHtml() + screenBodyHtml();
  const apply = () => { document.getElementById('card').innerHTML = html; hydrateIcons(); };
  if (document.startViewTransition && !prefersReducedMotion()) {
    document.startViewTransition(apply);
  } else {
    apply();
  }
  if (screen === 'instantResult') {
    const percent = Math.round((partAScore() / 24) * 100);
    setTimeout(() => animateResultGauge(percent), 200);
  }
}

function selectGender(i) {
  selectedGender = i;
  document.querySelectorAll('#card .option').forEach((btn, idx) => btn.classList.toggle('selected', idx === i));
  setTimeout(() => { screen = 'ageSelect'; render(); }, 220);
}
function selectAge(i) {
  selectedAge = i;
  document.querySelectorAll('#card .option').forEach((btn, idx) => btn.classList.toggle('selected', idx === i));
  setTimeout(() => { screen = 'diagnosisStatus'; render(); }, 220);
}
function selectDiagnosis(i) {
  selectedDiagnosis = i;
  document.querySelectorAll('#card .option').forEach((btn, idx) => btn.classList.toggle('selected', idx === i));
  setTimeout(() => { screen = 'question'; qIndex = 0; render(); }, 220);
}
function selectAnswer(i) {
  answers[qIndex] = i;
  document.querySelectorAll('#card .option').forEach((btn, idx) => btn.classList.toggle('selected', idx === i));
  setTimeout(() => {
    const answeredCount = qIndex + 1;
    if (qIndex >= QUESTIONS.length - 1) {
      screen = 'calculating';
      render();
      setTimeout(() => animateCalculatingScreen(), 60);
      setTimeout(() => {
        if (screen === 'calculating') { screen = 'instantResult'; render(); }
      }, 8000);
      return;
    }
    if (answeredCount % 4 === 0) {
      breatherIndex = (answeredCount / 4 - 1) % BREATHERS.length;
      screen = 'breather';
      render();
      setTimeout(() => animateBreatherTimer(), 60);
      setTimeout(() => {
        if (screen === 'breather') { qIndex++; screen = 'question'; render(); }
      }, 4000);
    } else {
      qIndex++;
      render();
    }
  }, 220);
}
function goBack() {
  if (screen === 'ageSelect') { screen = 'genderSelect'; render(); }
  else if (screen === 'diagnosisStatus') { screen = 'ageSelect'; render(); }
  else if (screen === 'question') {
    if (qIndex > 0) { qIndex--; render(); }
    else { screen = 'diagnosisStatus'; render(); }
  } else if (screen === 'instantResult') { screen = 'question'; qIndex = QUESTIONS.length - 1; render(); }
  else if (screen === 'emailCapture') { screen = 'instantResult'; render(); }
}
function goEmailCapture() { screen = 'emailCapture'; render(); }

async function submitEmail(e) {
  e.preventDefault();
  const email = document.getElementById('emailInput').value;
  const s = fullScoring();
  const btn = e.target.querySelector('button[type="submit"]');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Sending\u2026';
  try {
    console.log('[subscribe] sending request for', email);
    const res = await fetch('/.netlify/functions/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email, subtype: s.subtype, score: s.totalScore,
        gender: selectedGender !== null ? GENDER_OPTIONS[selectedGender] : null,
        ageRange: selectedAge !== null ? AGE_RANGES[selectedAge] : null,
        diagnosisStatus: selectedDiagnosis !== null ? DIAGNOSIS_OPTIONS[selectedDiagnosis] : null,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      console.error('[subscribe] failed:', res.status, data);
      throw new Error('Subscription request failed');
    }
    console.log(data.mock
      ? '[subscribe] ✅ mock success — beehiiv not connected yet, function logic checks out'
      : '[subscribe] ✅ confirmed sent to beehiiv');
    screen = 'thankYou';
    render();
  } catch (err) {
    console.error('[subscribe] error:', err);
    btn.disabled = false;
    btn.textContent = originalLabel;
    alert("Something didn't go through. Mind trying again?");
  }
}

/* ============================================================
   DEV-ONLY SCREEN JUMPER — temporary, delete this whole block
   before launch.
   ============================================================ */
function initDevPanel() {
  const panel = document.getElementById('devPanel');
  const screens = ['genderSelect', 'ageSelect', 'diagnosisStatus', 'question', 'breather', 'calculating', 'instantResult', 'emailCapture', 'thankYou'];
  panel.style.display = 'flex';
  panel.innerHTML = screens.map(s =>
    `<button onclick="devJumpTo('${s}')" style="font-size:11px;padding:6px 10px;border-radius:6px;border:none;background:#333;color:#fff;cursor:pointer;">${s}</button>`
  ).join('');
}
function devJumpTo(targetScreen) {
  screen = targetScreen;
  if (targetScreen === 'question') qIndex = 0;
  if (targetScreen === 'breather') breatherIndex = 0;
  render();
}

render();
initDevPanel();
</script>
