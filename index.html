<script src="https://unpkg.com/lucide@latest"></script>

<style>
  :root {
    /* ---- adhd-ui design system tokens (T013 reskin) — exact hex values
       per the adhd-ui skill, used verbatim, never approximated. ---- */
    --accent: #ffd559;
    --accent-alt-light: #ffe38a;
    --accent-alt-deep: #f5c53c;
    --ink: #2A2A2A;
    --ink-soft: #6b6b6b;
    --ink-faint: #A6A6A0;
    --on-accent-label: #6b5a12;
    --white: #ffffff;
    --card: #FCFCFA;
    --border: #F2F2ED;
    --input-border: #EFEFE9;
    --track: #F5F5F0;
    --chip-yellow: #FFF3C4;
    --chip-coral: #FFE9E5;
    --chip-coral-deep: #FFDCD4;
    --chip-teal: #E9F5F1;
    --chip-blue: #DEE7FF;
    --icon-inactive: #CFCFC7;
    /* Data-viz warm secondary palette — added for T015, per the
       quiz-funnel-adhd-ui skill's "Approved extension" section. Scoped
       exception to the one-accent rule: used ONLY for data/stat fills
       (bar-chart/progress-bar-stat fills), never for buttons/CTAs/nav,
       which stay locked to --accent per the skill's own button rule.
       --accent (#ffd559) and --accent-alt-deep (#f5c53c, single-highlight
       value) are already defined above and are reused as the first/
       highlight members of this rotation — only the 3 new hues below
       were missing from the token set. */
    --dataviz-coral: #FF9B85;
    --dataviz-teal: #5EC8A8;
    --dataviz-periwinkle: #8CA3F5;

    /* Marigold scale — LEFT UNCHANGED per T013 scope: this is the
       companion character's own golden body-fill family (referenced
       directly inside the pose SVGs), distinct from the app's UI-chrome
       accent usage, which has been repointed to --accent above. */
    --marigold-50: #FFFAEA;
    --marigold-100: #FFF1C6;
    --marigold-300: #FEDD77;
    --marigold-500: #F5C22E;
    --marigold-700: #A67A0C;
    --marigold-800: #6E5008;
    /* Teal accent scale — added for T011's marigold + teal restyle.
       --teal-700 is kept (as the deep/contrast partner for --chip-teal,
       see BREATHERS below); --teal-300/--teal-500 are no longer
       referenced anywhere after this reskin (breather backgrounds now
       use the adhd-ui chip-tint rotation) but are left defined, unused,
       rather than deleted, since T013 is cosmetic-only. */
    --teal-300: #7ED9C9;
    --teal-500: #6FCF97;
    --teal-700: #2D9C8F;
    /* Ink (neutral) scale — exact hex from design handoff. --ink-900 and
       --ink-800 values were updated per T013 (see changelog) to
       neutral charcoal tones matching adhd-ui's --ink, since their old
       warm-tinted values are exactly the kind of near-black brown the
       adhd-ui skill explicitly bans. --ink-50/--ink-200/--ink-300 are
       left defined but are now unused dead tokens (their call sites were
       repointed directly to --white/--card/--border/--input-border) —
       not deleted, per this task's cosmetic/minimal-diff scope. */
    --ink-0: #FFFFFF;
    --ink-50: #FBF8F3;
    --ink-100: #F5F5F0;
    --ink-200: #E7DFD5;
    --ink-300: #D2C7BA;
    --ink-900: #2A2A2A;
    --ink-800: #3A3A3A;
    /* Character cheek color — was only ever a hardcoded SVG fallback
       (var(--ripe-100, #FDE2D5)) with no explicit :root definition;
       added here per T013 and set to adhd-ui's --chip-coral-deep value,
       which the skill explicitly documents as "mascot cheeks." */
    --ripe-100: #FFDCD4;
    /* Semantic aliases — repointed per T013 to the adhd-ui token set
       instead of the old warm ink/marigold scale. Aliases themselves are
       kept (other rules reference these names) — only what they resolve
       to has changed. */
    --text-strong: var(--ink);
    --text-muted: var(--ink-soft);
    --text-subtle: var(--ink-faint);
    --border-subtle: var(--border);
    --border-default: var(--input-border);
    --surface-page: var(--ink-0);
    /* Radius */
    --radius-md: 14px;
    --radius-lg: 18px;
    --radius-pill: 999px;
    /* Severity colors — adhd-ui doesn't define severity colors, so the
       old saturated mint/coral/blue trio has been replaced (see
       .band-badge below) with the adhd-ui chip-tint rotation. These raw
       tokens are left defined, unused, rather than deleted (cosmetic/
       minimal-diff scope) — kept only in case something outside this
       audit still reads them. */
    --mint: #8FE0A8;
    --mint-ink: #1B4D33;
    --coral: #F0AB8E;
    --coral-ink: #6B3117;
    --blue: #A9C7EA;
    --blue-ink: #1E3A5C;
  }

  * { box-sizing: border-box; }

  /* Body background — adhd-ui backgrounds are white or --card, never a
     warm off-white/cream (that's exactly the tone rule 2 of the skill
     bans). Repointed from the old --ink-50 to --white per T013. */
  body {
    margin: 0;
    background: var(--white);
    color: var(--text-strong);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    padding: 28px 23px 92px;
  }

  /* NOTE: the mockup's ".phone" frame (border, shadow, 28px radius) is
     explicitly documented as "a mockup framing device, not part of the
     real UI" — so it is deliberately NOT recreated here. Content sits
     directly on the page background, matching the actual intended
     production UI rather than the presentation artifact. */
  .stage { width: 100%; max-width: 450px; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .topbar .back {
    background: none; border: none; cursor: pointer;
    color: var(--text-strong); padding: 0;
    display: flex; align-items: center;
    width: 25px; height: 25px;
  }
  .topbar .label {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600; font-size: 17px; color: var(--text-strong);
  }
  .topbar .spacer { width: 25px; }

  .progress-block { margin-bottom: 32px; }
  .progress-label-row {
    display: flex;
    justify-content: space-between;
    font-family: 'Nunito', sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 7px;
    min-height: 18px;
  }
  .progress-track {
    height: 9px;
    border-radius: var(--radius-pill);
    background: var(--ink-100);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: var(--radius-pill);
    background: var(--accent);
    transition: width 0.35s cubic-bezier(.4,0,.2,1);
  }

  /* adhd-ui chip/icon squares are flat single-tint fills — no gradients. */
  .icon-square {
    width: 64px; height: 64px;
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 23px;
    background: var(--accent);
  }
  .icon-square.mint { background: var(--chip-teal); }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--on-accent-label);
    background: var(--accent);
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    margin-bottom: 23px;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.3;
    letter-spacing: -0.01em;
    color: var(--text-strong);
    margin: 0 0 12px 0;
  }

  p.lede {
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    line-height: 1.6;
    color: var(--text-muted);
    margin: 0 0 32px 0;
    font-weight: 500;
  }
  p.lede.centered { text-align: center; }
  p.lede.small { font-size: 15.5px; margin-bottom: 25px; }

  .question-text {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 25px;
    line-height: 1.35;
    letter-spacing: -0.005em;
    color: var(--text-strong);
    margin: 0 0 28px 0;
  }

  .options { display: flex; flex-direction: column; gap: 11px; }

  .question-hint {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    margin: -16px 0 16px 0;
  }

  /* Answer row — exact structure: flex row, space-between, so a check
     icon (added only when selected) naturally right-aligns without
     needing absolute positioning. Text color does NOT change on
     selection per the mockup — only background and border do. */
  .option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 21px;
    border: 1.5px solid var(--border-subtle);
    border-radius: var(--radius-md);
    background: var(--card);
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text-strong);
    text-align: left;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .option:hover { transform: translateY(-1px); }
  .option:active { transform: translateY(0) scale(0.99); }
  .option:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .option.selected {
    background: var(--chip-yellow);
    border-color: var(--accent);
    animation: optionPop 0.28s ease;
  }
  .option .check-icon {
    opacity: 0;
    color: var(--ink);
    display: flex;
    flex-shrink: 0;
  }
  .option.selected .check-icon { opacity: 1; }

  @keyframes optionPop {
    0% { transform: scale(1); }
    45% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  /* Primary button — ink-on-accent (background:#ffd559; color:#2A2A2A),
     locked per the quiz-funnel-adhd-ui skill: every primary CTA in this
     funnel uses this exact treatment, never the inverse accent-on-ink,
     including on the full-ink calculating screen (which has no button
     of its own here, but the rule is applied consistently regardless).
     Radius changed from a full pill (999px) to 16px per adhd-ui's
     14–18px button-radius spec — the one deliberate shape change in
     this task; still reads correctly at the existing 48px height. */
  .btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 17px;
    border: none;
    border-radius: var(--radius-lg);
    height: 55px;
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--accent); color: var(--ink); }
  .btn.primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .microcopy {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--text-subtle);
    text-align: center;
    margin-top: 12px;
  }

  /* Severity badge — adhd-ui doesn't define severity colors, so this
     uses the skill's chip-tint rotation instead of the old saturated
     mint/coral/blue trio: calmer chip-teal for Low, neutral chip-yellow
     for Moderate (the unmodified base class), warmer chip-coral for
     High. Text is --ink for all three (matching the component library's
     own pale-yellow eyebrow-pill example, which also uses plain ink text
     directly on a chip background — --on-accent-label is reserved for
     text on the *solid* accent color specifically, not pale chip tints). */
  .band-badge {
    display: inline-block;
    padding: 7px 16px;
    border-radius: var(--radius-pill);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    margin-bottom: 5px;
    background: var(--chip-yellow);
    color: var(--ink);
  }
  .band-badge.low { background: var(--chip-teal); color: var(--ink); }
  .band-badge.high { background: var(--chip-coral); color: var(--ink); }

  .disclaimer {
    font-family: 'Nunito', sans-serif;
    font-weight: 500;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-subtle);
    border-top: 1px solid var(--border-subtle);
    margin-top: 28px;
    padding-top: 18px;
  }

  .trust-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin-top: 18px;
  }
  .trust-row svg { flex-shrink: 0; margin-top: 1px; }
  .trust-row span {
    font-family: 'Nunito', sans-serif;
    font-weight: 500;
    font-size: 14px;
    line-height: 1.55;
    color: var(--text-subtle);
  }

  .field-label {
    display: block;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--text-strong);
    margin-bottom: 7px;
  }

  input[type="email"] {
    width: 100%;
    height: 51px;
    padding: 0 18px;
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-md);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 17px;
    background: var(--surface-page);
    color: var(--text-strong);
  }
  input[type="email"]:focus-visible { outline: none; border-color: var(--ink-900); border-width: 2px; }

  .calc-companion-icon { display: inline-block; margin-bottom: 23px; }

  .metric-row { margin-bottom: 18px; }
  .metric-row:last-child { margin-bottom: 0; }
  .metric-label-row {
    display: flex;
    justify-content: space-between;
    font-family: 'Nunito', sans-serif;
    font-weight: 500;
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 7px;
  }
  .metric-track {
    /* 10px height / 8px radius — matches the quiz-funnel-adhd-ui skill's
       canonical "progress bar stat row" data-viz component spec
       (references/components.md section 9) exactly. Was 8px height /
       999px (pill) radius pre-T015. Scaled up ~15% for the larger UI pass. */
    height: 12px;
    border-radius: 9px;
    background: var(--ink-100);
    overflow: hidden;
  }
  .metric-fill {
    height: 100%;
    width: 0%;
    border-radius: 9px;
  }

  .breather {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 9px 0 14px;
  }
  .breather-icon {
    width: 240px; height: 240px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
  }
  .breather-img {
    display: block;
    max-width: 100%; max-height: 100%;
    /* contain, not cover — every source image keeps its full, uncropped
       frame; the source images have different native aspect ratios, so
       each is scaled down to fit this identical 240x240 slot rather
       than cropped to fill it. */
    object-fit: contain;
    border-radius: var(--radius-lg);
  }
  .breather-text {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 24px;
    line-height: 1.45;
    letter-spacing: -0.01em;
    color: var(--text-strong);
    max-width: 368px;
    margin: 0;
  }
  .breather-timer-track {
    width: 150px;
    height: 6px;
    border-radius: var(--radius-pill);
    background: var(--ink-100);
    overflow: hidden;
    margin-top: 28px;
  }
  .breather-timer-fill {
    height: 100%;
    width: 0%;
    border-radius: var(--radius-pill);
  }
  @media (prefers-reduced-motion: reduce) { .breather-timer-fill { transition: none !important; } }

  .fade-in { animation: fadeIn 0.3s cubic-bezier(.4,0,.2,1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* Gauge — conic-gradient exactly as specced, animated via a CSS custom
     property. Inner circle uses --surface-page (pure white), which now
     matches the page's own --white background (both pure white per
     adhd-ui), rather than sitting on a warm off-white as before. */
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 23px; }
  .gauge-outer {
    --gauge-pct: 0%;
    width: 193px; height: 193px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: conic-gradient(var(--accent) var(--gauge-pct), var(--ink-100) var(--gauge-pct));
  }
  .gauge-outer.animating { transition: --gauge-pct 1.1s cubic-bezier(.34,1.1,.64,1); }
  .gauge-inner {
    width: 152px; height: 152px;
    border-radius: 50%;
    background: var(--surface-page);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .gauge-percent {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 39px;
    color: var(--text-strong);
    letter-spacing: -0.01em;
  }
  .gauge-caption { font-family: 'Nunito', sans-serif; font-weight: 500; font-size: 13px; color: var(--text-muted); }

  .result-label {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 22px;
    text-align: center;
    color: var(--text-strong);
    letter-spacing: -0.005em;
    margin: 0 0 9px 0;
  }

  .locked-teaser {
    border: 1.5px dashed var(--border-default);
    border-radius: var(--radius-lg);
    padding: 18px;
    margin-bottom: 23px;
  }
  .locked-teaser-header {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--text-strong);
    margin-bottom: 12px;
  }
  .locked-teaser-header svg { color: var(--text-muted); flex-shrink: 0; }
  /* Skeleton bars: 4px radius exactly, NOT a pill — this was a real
     discrepancy from an earlier pass, corrected here. Scaled up ~15%
     for the larger UI pass. */
  .skeleton-bar { height: 12px; background: var(--ink-100); border-radius: 5px; }
  .skeleton-bars { display: flex; flex-direction: column; gap: 9px; }

  @property --gauge-pct {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 0%;
  }

  ::view-transition-old(quiz-card) { animation: card-out 0.24s cubic-bezier(.4,0,.2,1) forwards; }
  ::view-transition-new(quiz-card) { animation: card-in 0.3s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes card-out { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-6px); } }
  @keyframes card-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
    .progress-fill { transition: none; }
    .gauge-outer.animating { transition: none; }
    ::view-transition-old(quiz-card), ::view-transition-new(quiz-card) { animation: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div id="card" style="view-transition-name: quiz-card;"></div>
</div>

<!-- ============================================================
     DEV-ONLY SCREEN JUMPER — temporary, delete this whole block
     (and initDevPanel/devJumpTo in the script below) before launch.
     Enable by adding ?dev=1 to the URL.
     ============================================================ -->
<div id="devPanel" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#1a1a1a; padding:10px; gap:6px; flex-wrap:wrap; z-index:9999; justify-content:center; font-family:sans-serif;"></div>

<script type="module" src="js/main.js"></script>

</body>
</html>
